# 1. Configurer la connexion H2 en mode de compatibilité MySQL
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 2. Forcer Hibernate à utiliser le dialecte H2 pour les tests (empêche l'ajout de engine=InnoDB)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# 3. Recréer la structure de la base à chaque test
spring.jpa.hibernate.ddl-auto=create-drop